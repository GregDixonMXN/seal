name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build -o seal .
      - run: ./seal compile --in seal.toml --out-dir /tmp/seal-out-check && diff -r /tmp/seal-out-check seal-out
