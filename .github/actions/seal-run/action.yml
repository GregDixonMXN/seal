name: Seal compile and drift check
description: Compile seal.toml with a pinned seal release and fail when the committed seal-out policies drifted.
inputs:
  seal_toml:
    description: Path to the seal.toml org policy file.
    required: false
    default: seal.toml
  out_dir:
    description: Committed seal-out directory to compare the fresh compile against.
    required: false
    default: seal-out
  version:
    description: Seal release version, without the leading v.
    required: false
    default: 0.1.0
  repository:
    description: GitHub repository hosting seal releases (owner/name).
    required: false
    default: GregDixonMXN/seal
runs:
  using: composite
  steps:
    - name: Require Linux x86_64
      shell: bash
      run: |
        set -eu
        [ "$(uname -s)-$(uname -m)" = "Linux-x86_64" ] || { echo "seal action supports Linux x86_64 runners only" >&2; exit 1; }
    - name: Download seal release binary
      shell: bash
      run: |
        set -eu
        V="${{ inputs.version }}"
        R="${{ inputs.repository }}"
        A="seal-${V}-linux-x86_64.tar.gz"
        cd "$RUNNER_TEMP"
        curl -fsSL -o "$A" "https://github.com/${R}/releases/download/v${V}/${A}"
        curl -fsSL -o "${A}.sha256" "https://github.com/${R}/releases/download/v${V}/${A}.sha256"
        (cd "$RUNNER_TEMP" && sha256sum -c "${A}.sha256")
        tar -xzf "$RUNNER_TEMP/$A" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/seal-${V}-linux-x86_64" >> "$GITHUB_PATH"
    - name: Compile and check drift
      shell: bash
      env:
        SEAL_TOML: ${{ inputs.seal_toml }}
        SEAL_OUT_DIR: ${{ inputs.out_dir }}
      run: |
        set -eu
        FRESH="${RUNNER_TEMP:-$(mktemp -d)}/seal-out-fresh"
        rm -rf "$FRESH"
        seal compile --in "$SEAL_TOML" --out-dir "$FRESH"
        if ! diff -r "$FRESH" "$SEAL_OUT_DIR" >"$RUNNER_TEMP/seal-drift.txt" 2>&1; then
          {
            echo "## Seal drift check"
            echo ""
            echo "Fresh compile of \`$SEAL_TOML\` differs from committed \`$SEAL_OUT_DIR\` — run \`seal compile\` and commit the result."
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/seal-drift.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        {
          echo "## Seal drift check"
          echo ""
          echo "Fresh compile of \`$SEAL_TOML\` matches committed \`$SEAL_OUT_DIR\`."
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload fresh compile
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: seal-out-fresh
        path: ${{ runner.temp }}/seal-out-fresh/
